# Publicar la app en tu dominio con login de Authelia (contraseña + código de 6 dígitos), detrás de Traefik.
# Pensado para Dokploy; sirve para cualquier servidor con Traefik. Paso a paso: GUIA_DESPLIEGUE.md / GUIDE_DEPLOY.md.
# Para usar la app en tu ordenador NO hace falta nada de esto: npm run dev.
#
# Los valores vienen del .env que Dokploy escribe junto a este fichero (pestaña Environment).
# Las rutas ../files/ son los «File Mounts» de Dokploy (Advanced → Mounts).

services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - '4173'                     # sin «ports»: solo se llega a la app a través de Traefik
    environment:
      - AUTH_MODE=authelia
      - AUTH_PROXY_SECRET=${AUTH_PROXY_SECRET:?falta AUTH_PROXY_SECRET}
      - AUTH_LOGOUT_URL=https://${AUTH_DOMAIN:?falta AUTH_DOMAIN}/logout
      - SUUNTO_TIMEZONE=${SUUNTO_TIMEZONE:-}
      - SUUNTO_SESSION_KEY=${SUUNTO_SESSION_KEY:-}
      - TP_AUTH_COOKIE=${TP_AUTH_COOKIE:-}
      - TP_ATHLETE_ID=${TP_ATHLETE_ID:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_FALLBACK_MODELS=${AI_FALLBACK_MODELS:-}
    volumes:
      - suunto-data:/app/public/data
      - suunto-fit:/app/fetch/fit
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.suunto.loadbalancer.server.port=4173
      # HTTPS con login: primero Authelia, después el secreto que server/auth.ts exige
      - traefik.http.routers.suunto.rule=Host(`${SUUNTO_DOMAIN:?falta SUUNTO_DOMAIN}`)
      - traefik.http.routers.suunto.entrypoints=websecure
      - traefik.http.routers.suunto.tls.certresolver=letsencrypt
      - traefik.http.routers.suunto.service=suunto
      - traefik.http.routers.suunto.middlewares=suunto-authelia,suunto-proxy-secret
      - traefik.http.middlewares.suunto-proxy-secret.headers.customrequestheaders.X-Auth-Proxy-Secret=${AUTH_PROXY_SECRET}
      # http:// solo redirige a https://
      - traefik.http.routers.suunto-http.rule=Host(`${SUUNTO_DOMAIN}`)
      - traefik.http.routers.suunto-http.entrypoints=web
      - traefik.http.routers.suunto-http.service=suunto
      - traefik.http.routers.suunto-http.middlewares=suunto-to-https
      - traefik.http.middlewares.suunto-to-https.redirectscheme.scheme=https

  suunto-authelia:
    # versión fijada: al subirla, revisa antes los cambios de su configuración
    image: authelia/authelia:4.39
    restart: unless-stopped
    expose:
      - '9091'
    environment:
      - X_AUTHELIA_CONFIG_FILTERS=template
      - SUUNTO_DOMAIN=${SUUNTO_DOMAIN}
      - AUTH_DOMAIN=${AUTH_DOMAIN}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:?falta COOKIE_DOMAIN}   # la dirección de la app, no el dominio entero
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET:?falta AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY:?falta AUTHELIA_STORAGE_ENCRYPTION_KEY}
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${AUTHELIA_JWT_SECRET:?falta AUTHELIA_JWT_SECRET}
    volumes:
      - ../files/authelia:/config:ro   # configuration.yml y users_database.yml
      - authelia-data:/data            # códigos TOTP registrados, sesiones y avisos
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.suunto-auth.loadbalancer.server.port=9091
      - traefik.http.routers.suunto-auth.rule=Host(`${AUTH_DOMAIN}`)
      - traefik.http.routers.suunto-auth.entrypoints=websecure
      - traefik.http.routers.suunto-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.suunto-auth.service=suunto-auth
      - traefik.http.middlewares.suunto-authelia.forwardauth.address=http://suunto-authelia:9091/api/authz/forward-auth
      - traefik.http.middlewares.suunto-authelia.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.suunto-authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Email,Remote-Name

volumes:
  suunto-data:
  suunto-fit:
  authelia-data:

networks:
  dokploy-network:
    external: true
